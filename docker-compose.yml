# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: student_os
      POSTGRES_PASSWORD: student_os
      POSTGRES_DB: student_os
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
